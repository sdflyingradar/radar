name: Update forecast

on:
  schedule:
    - cron: "17 13-23/2 * * *"   # every 2 h through the day: 5, 7, 9, 11 am, 1, 3 pm PST (an hour later in PDT); Open-Meteo budget
    - cron: "17 2,5 * * *"       # evening: 6 pm and 9 pm PST; then nothing until the 5 am run
    - cron: "57 13 * * *"        # quiet backup for the 5 am run (does nothing if that one already came)
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  gate:
    # the morning run and its quiet backup ~40 min later: whichever starts second does nothing if the other has
    # already brought fresh data (GitHub's scheduler can be an hour late or skip a run)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: data/forecast.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          go=1
          case "${{ github.event.schedule }}" in
            "17 13-23/2 * * *"|"57 13 * * *")
              age=$(python3 -c "import json,datetime as d;g=json.load(open('data/forecast.json'))['generated'].replace('Z','+00:00');t=d.datetime.fromisoformat(g if '+' in g[10:] else g+'+00:00');print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()/60))" 2>/dev/null || echo 9999)
              echo "data is $age min old"
              [ "$age" -lt 50 ] && go=0 ;;
          esac
          echo "go=$go" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Restore last good model runs
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: om-${{ github.run_id }}
          restore-keys: om-
      - name: Build forecast
        run: python -u scripts/build_forecast.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: Claude summary of the NWS discussion
      - name: Keep model runs for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: om-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/forecast.json data/history data/trend.json data/archive data/modellog data/gradient.json data/gradient_obs.json
          git diff --cached --quiet && exit 0
          git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          # if files were committed while the job ran, take them in first, then save
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
