name: Update sounding

on:
  schedule:
    # right after the flights: the balloons go up about 11Z and 23Z (3 am / 3 pm PST), reach the top about 1.5-2 h later
    # and are posted soon after. Fetch at 13:05 and 01:05 UTC, with a second try 40 min later for a late post.
    - cron: "5,45 13 * * *"        # 5:05 / 5:45 am PST (6:05 / 6:45 PDT): the morning (12Z) balloon
    - cron: "5,45 1 * * *"         # 5:05 / 5:45 pm PST (6:05 / 6:45 PDT): the evening (00Z) balloon
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sounding
  cancel-in-progress: false

jobs:
  sounding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch NKX sounding
        run: python -u scripts/sounding/fetch_sounding.py
      - name: Fetch nearby balloons (Edwards, Vandenberg, Yuma, Las Vegas) for the regions
        continue-on-error: true
        run: python -u scripts/sounding/fetch_stations.py
      - name: Keep 3 months of balloons (delete older files)
        run: python -u scripts/sounding/prune.py
      - name: Archive every balloon (and index it for the path map)
        run: python -u scripts/sounding/archive_index.py
      - name: Render plot
        run: node scripts/sounding/render_sounding.js
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/sounding
          git diff --cached --quiet && exit 0
          python3 scripts/runlog.py balloon && git add data/runs   # when this update landed, for the timeline
          git commit -m "Sounding update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
