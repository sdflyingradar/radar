name: Update SD region panel

on:
  schedule:
    - cron: "27 13,16,19,22 * * *"   # every 3 h through the flying day (PST 5:27, 8:27, 11:27 am, 2:27 pm); Open-Meteo budget
    - cron: "27 2 * * *"             # once in the evening (6:27 pm PST); none between 10 pm and 5 am
    - cron: "7 14 * * *"             # quiet backup for the 5:27 am run (does nothing if that one already came)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: region
  cancel-in-progress: false

jobs:
  gate:
    # the morning run and its quiet backup ~40 min later: whichever starts second does nothing if the other has
    # already brought fresh data (GitHub's scheduler can be an hour late or skip a run)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: data/region/regions.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          go=1
          case "${{ github.event.schedule }}" in
            "27 13,16,19,22 * * *"|"7 14 * * *")
              age=$(python3 -c "import json,datetime as d;g=json.load(open('data/region/regions.json'))['generated'].replace('Z','+00:00');t=d.datetime.fromisoformat(g if '+' in g[10:] else g+'+00:00');print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()/60))" 2>/dev/null || echo 9999)
              echo "data is $age min old"
              [ "$age" -lt 50 ] && go=0 ;;
          esac
          echo "go=$go" >> "$GITHUB_OUTPUT"

  region:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last global model runs
        uses: actions/cache/restore@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}
          restore-keys: region-
      - name: Sample region terrain (only when polygons change)
        run: python -u scripts/region/terrain.py
      - name: Build SD region panel data
        run: python -u scripts/region/build_region.py
      - name: Keep global model runs for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/region
          git diff --cached --quiet && exit 0
          git commit -m "Region update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
