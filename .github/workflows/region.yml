name: Update SD region panel

on:
  schedule:
    - cron: "34 13,15,16,20,23 * * *"   # 5:34, 7:34, 8:34 am, 12:34, 3:34 pm PST (an hour later in PDT); a few min after the forecast
    - cron: "34 2,6 * * *"              # 6:34 pm, 10:34 pm PST
    - cron: "34 10 * * *"               # 2:34 am PST: HRRR / RRFS only, the global models are reused (budget)
    - cron: "14 14 * * *"               # quiet backup for the 5:34 am run (does nothing if that one already came)
  workflow_dispatch:
    inputs:
      light:
        description: "HRRR / RRFS only (reuse the global models)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: region
  cancel-in-progress: false

jobs:
  gate:
    # the morning run and its quiet backup ~40 min later: whichever starts second does nothing if the other has
    # already brought fresh data (GitHub's scheduler can be an hour late or skip a run)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: data/region/regions.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          go=1
          # every scheduled run (they can come an hour or more late) does nothing if fresh data is already in
          if [ "${{ github.event_name }}" = "schedule" ]; then
              age=$(python3 -c "import json,datetime as d;g=json.load(open('data/region/regions.json'))['generated'].replace('Z','+00:00');t=d.datetime.fromisoformat(g if '+' in g[10:] else g+'+00:00');print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()/60))" 2>/dev/null || echo 9999)
              echo "data is $age min old"
              [ "$age" -lt 50 ] && go=0
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  region:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last global model runs
        uses: actions/cache/restore@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}
          restore-keys: region-
      - name: Sample region terrain (only when polygons change)
        run: python -u scripts/region/terrain.py
      - name: Build SD region panel data
        run: |
          if [ "${{ github.event.schedule }}" = "34 10 * * *" ] || [ "${{ inputs.light }}" = "true" ]; then export REUSE_H=99; fi
          python -u scripts/region/build_region.py
      - name: Keep global model runs for next time
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache/region
          key: region-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit data
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data/region
          git diff --cached --quiet && exit 0
          python3 scripts/runlog.py region && git add data/runs   # when this update landed, for the timeline
          git commit -m "Region update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
