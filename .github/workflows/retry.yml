name: Retry failed runs

# When a forecast, therm (region) or balloon run fails, run its failed part again right away (up to 2 more tries).
on:
  workflow_run:
    workflows: ["Update forecast", "Update SD region panel", "Update sounding"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Run the failed jobs again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}
