name: Move old data to the archive branch

# Keeps the website small: once a week the old raw model inputs (for re-scoring) and the old balloon files move from
# main to the 'archive' branch, same paths. Nothing is deleted; the archive branch is not part of the website.
on:
  schedule:
    - cron: "23 11 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Move
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          python3 scripts/archive/move_old.py > /tmp/move.txt
          n=$(grep -c . /tmp/move.txt || true); echo "files to move: $n"
          [ "$n" = "0" ] && exit 0
          # the archive branch (made on first use) in its own folder
          if git ls-remote --exit-code --heads origin archive >/dev/null; then
            git fetch -q --depth 1 origin archive && git worktree add -q ../arc FETCH_HEAD && (cd ../arc && git switch -q -c archive)
          else
            git worktree add -q --detach ../arc && (cd ../arc && git switch -q --orphan archive)
          fi
          while read -r f; do mkdir -p "../arc/$(dirname "$f")"; cp "$f" "../arc/$f"; done < /tmp/move.txt
          (cd ../arc && git add -A && git commit -q -m "Archive: $n files moved from main" && git push -q origin archive)
          # then off main
          xargs git rm -q < /tmp/move.txt
          git commit -q -m "Move $n old files to the archive branch"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
